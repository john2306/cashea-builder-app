server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Adjuntos en base64 pueden pesar; subimos el límite del body.
  client_max_body_size 64m;

  # API → backend. proxy_buffering off para que el SSE (run del agente, stream de deploy)
  # llegue token a token; read_timeout largo para runs/streams.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Gateway de login (Google SSO).
  location /auth/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket legacy (el builder usa SSE, pero lo dejamos por compatibilidad).
  location /ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # SPA: cualquier otra ruta sirve index.html (routing del lado cliente).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
